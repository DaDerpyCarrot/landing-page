<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Roadimentary</title>
  <link rel="icon" type="image/png" href="/assets/fav_logo.png" />
  <style>
    :root {
      --brown: #3b2b1f;
      --brown-soft: #6b5440;
      --paper: #f4e8cc;
      --paper-edge: #e2cfa5;
      --gold: #f2b705;
      --gold-dark: #b98a00;
      --ok: #2f6b2f;
      --bad: #a3321f;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: var(--brown);
      background:
        linear-gradient(rgba(20, 13, 8, 0.62), rgba(20, 13, 8, 0.78)),
        url("/assets/Menu_Screen.png") center / cover no-repeat fixed;
      background-color: #21170f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .logo {
      width: min(420px, 90%);
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.55));
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--paper);
      border: 3px solid var(--brown);
      border-radius: 10px;
      box-shadow: 0 8px 0 var(--brown), 0 18px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .hazard {
      height: 14px;
      background: repeating-linear-gradient(-45deg, var(--gold) 0 14px, var(--brown) 14px 28px);
      border-bottom: 3px solid var(--brown);
    }

    .card-body { padding: 26px 26px 22px; }

    h1 {
      margin: 0 0 6px;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--brown-soft);
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .password-field {
      position: relative;
      margin-bottom: 16px;
    }

    .password-field input {
      width: 100%;
      padding: 12px 52px 12px 14px;
      font-size: 1rem;
      color: var(--brown);
      background: #fffaf0;
      border: 2px solid var(--brown-soft);
      border-radius: 6px;
      outline: none;
    }

    .password-field input:focus {
      border-color: var(--gold-dark);
      box-shadow: 0 0 0 3px rgba(242, 183, 5, 0.35);
    }

    .password-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--brown);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover { background: rgba(59, 43, 31, 0.1); }
    .password-toggle:focus-visible { outline: 2px solid var(--gold-dark); }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .password-toggle .icon-hide { display: none; }
    .password-toggle.visible .icon-show { display: none; }
    .password-toggle.visible .icon-hide { display: block; }


    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      border: 3px solid var(--brown);
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--brown);
      box-shadow: 0 4px 0 var(--brown);
    }

    .btn-secondary {
      margin-top: 12px;
      background: transparent;
      color: var(--brown);
      border-color: var(--brown-soft);
    }

    .btn:hover { transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brown); }
    .btn:focus-visible { outline: 3px solid var(--gold-dark); outline-offset: 2px; }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    #reset-status {
      margin: 18px 0 0;
      padding: 10px 12px;
      font-size: 0.9rem;
      background: var(--paper-edge);
      border-left: 4px solid var(--gold-dark);
      border-radius: 4px;
    }

    #reset-status:empty { display: none; }

    footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(244, 232, 204, 0.7);
    }

    @media (max-width: 420px) {
      .card-body { padding: 22px 18px 18px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <img class="logo" src="/assets/Roadimentary_Title.png" alt="Roadimentary" />

  <main class="card">
    <div class="hazard" aria-hidden="true"></div>
    <div class="card-body">
      <h1>Reset Password</h1>
      <p class="subtitle">Enter a new password for your operator account.</p>

      <label for="new-password">New password</label>
      <div class="password-field">
        <input type="password" id="new-password" autocomplete="new-password" />
        <button type="button" class="password-toggle" data-target="new-password" aria-label="Show password" title="Show password">
          <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
            <path d="M9.9 5.1A11.3 11.3 0 0 1 12 5c6.5 0 10 7 10 7a16.8 16.8 0 0 1-4 4.9"></path>
            <path d="M6.6 6.7C3.8 8.5 2 12 2 12a16.9 16.9 0 0 0 7.4 6.2"></path>
          </svg>
        </button>
      </div>

      <label for="confirm-password">Confirm new password</label>
      <div class="password-field">
        <input type="password" id="confirm-password" autocomplete="new-password" />
        <button type="button" class="password-toggle" data-target="confirm-password" aria-label="Show password" title="Show password">
          <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
            <path d="M9.9 5.1A11.3 11.3 0 0 1 12 5c6.5 0 10 7 10 7a16.8 16.8 0 0 1-4 4.9"></path>
            <path d="M6.6 6.7C3.8 8.5 2 12 2 12a16.9 16.9 0 0 0 7.4 6.2"></path>
          </svg>
        </button>
      </div>

      <button class="btn btn-primary" id="reset-btn">Update Password</button>
      <a class="btn btn-secondary" href="index.html">Back to Roadimentary</a>

      <p id="reset-status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <footer>Roadimentary &middot; Return to the game to sign in after updating.</footer>

  <script src="reset-password.js"></script>
</body>
</html>
