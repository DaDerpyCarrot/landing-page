<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Roadimentary</title>
  <link rel="icon" type="image/png" href="/assets/fav_logo.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .reset-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .reset-page-header {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .reset-page-main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .reset-card {
      width: 100%;
      max-width: 520px;
    }

    .reset-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .password-field {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-field input {
      width: 100%;
      padding-right: 56px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: #243444;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .password-toggle:hover {
      background: rgba(36, 52, 68, 0.12);
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .password-toggle .icon-hide {
      display: none;
    }

    .password-toggle.visible .icon-show {
      display: none;
    }

    .password-toggle.visible .icon-hide {
      display: block;
    }

    .secondary-btn {
      display: inline-block;
      padding: 12px;
      background: #d1dce5;
      color: #222;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #222;
      transition: all 0.15s ease;
    }

    .secondary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #222;
    }

    .secondary-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #222;
    }

    .reset-links {
      margin-top: 16px;
      text-align: center;
    }

    .reset-links a {
      color: #a2d8ff;
      text-decoration: underline;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      #taskbar {
        display: none;
      }

      .reset-page-main {
        align-items: flex-start;
        padding-top: 28px;
      }

      .reset-card.profile-card {
        width: 100%;
        max-width: 100%;
        margin: 0;
      }

      .profile-name {
        font-size: 1.8rem;
      }

      .profile-subtitle {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="reset-page">
    <header id="taskbar" class="reset-page-header">
      <div id="logo-container">
        <img src="/assets/editedlogo1.png" alt="Game Logo" id="logo" />
      </div>
    </header>

    <main class="reset-page-main">
      <section class="profile-card reset-card">
        <h1 class="profile-name">Reset Password</h1>
        <p class="profile-subtitle">Enter a new password for your operator account</p>

        <div class="signin-form">
          <div class="password-field">
            <input
              type="password"
              id="new-password"
              placeholder="New Password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle"
              data-target="new-password"
              aria-label="Show password"
              title="Show password"
            >
              <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>

              <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
                <path d="M9.9 5.1A11.3 11.3 0 0 1 12 5c6.5 0 10 7 10 7a16.8 16.8 0 0 1-4 4.9"></path>
                <path d="M6.6 6.7C3.8 8.5 2 12 2 12a16.9 16.9 0 0 0 7.4 6.2"></path>
              </svg>
            </button>
          </div>

          <div class="password-field">
            <input
              type="password"
              id="confirm-password"
              placeholder="Confirm New Password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle"
              data-target="confirm-password"
              aria-label="Show password"
              title="Show password"
            >
              <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>

              <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
                <path d="M9.9 5.1A11.3 11.3 0 0 1 12 5c6.5 0 10 7 10 7a16.8 16.8 0 0 1-4 4.9"></path>
                <path d="M6.6 6.7C3.8 8.5 2 12 2 12a16.9 16.9 0 0 0 7.4 6.2"></path>
              </svg>
            </button>
          </div>

          <div class="reset-actions">
            <button class="signin-btn" id="reset-btn">Update Password</button>
            <a class="secondary-btn" href="index.html">Back to Roadimentary</a>
          </div>
        </div>

        <p id="reset-status">Checking reset token...</p>
      </section>
    </main>
  </div>

  <script src="reset-password.js"></script>
</body>
</html>
